<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | பூங்கொடி இயற்கை பண்ணை</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-page"><main class="auth-card"><div class="brand-mark">PF</div><p class="eyebrow">POONGODI NATURE FARM</p><h1>பூங்கொடி இயற்கை பண்ணை</h1><p class="muted" data-i18n="login_subtitle">Family farm management, made simple.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><label data-i18n="family_email">Family email<input type="email" name="email" required value="{{ request.form.get('email', '') }}"></label><label data-i18n="password">Password<input type="password" name="password" required></label><label data-i18n="profile">Select profile<select name="profile_id">{% for profile in profiles %}<option value="{{ profile.id }}">{{ profile.name }} · {{ profile.role }}</option>{% endfor %}</select></label><button class="button primary" type="submit" data-i18n="login">Enter farm</button></form><button class="language-toggle" data-language-toggle>தமிழ் / English</button><p class="tiny">Use the family credentials configured in <code>.env</code>.</p></main><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
