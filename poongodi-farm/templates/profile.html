{% extends 'index.html' %}{% block content %}<section class="page-heading"><div><p class="eyebrow">PROFILE</p><h1 data-i18n="profile">Profile</h1><p class="muted">Your identity and account controls.</p></div></section><section class="profile-grid"><article class="panel profile-card"><div class="avatar large">{{ user.name[0] }}</div><h2>{{ user.name }}</h2><p>{{ user.email }}</p><span class="tag">{{ user.role }}</span></article><article class="panel"><h2 data-i18n="change_password">Change password</h2><form method="post" class="stack"><label>New password<input type="password" name="password" minlength="6" required></label><button class="button primary" type="submit">Update password</button></form></article></section>{% endblock %}
