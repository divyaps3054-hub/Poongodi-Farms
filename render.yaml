services:
  - type: web
    name: poongodi-farms-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: poongodi-farm-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGIN
        value: "https://divyaps3054-hub.github.io"
      - key: GOOGLE_CLIENT_ID
        value: "141270882885-jtusd34ofr0pfpbro6udqqgol6gepfsp.apps.googleusercontent.com"
      - key: FRONTEND_URL
        value: "https://divyaps3054-hub.github.io/Poongodi-Farms/"
      - key: DATA_DIR
        value: "/opt/render/project/src/data"
      - key: FARM_USERS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LOGIN_ALERT_TO
        sync: false
      - key: LOGIN_ALERT_FROM
        sync: false
